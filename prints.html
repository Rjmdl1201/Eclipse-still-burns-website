<!DOCTYPE html>
<html lang="en" class="scroll-smooth" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Same Tailwind setup as the homepage -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        offblack: '#111111',
                        purewhite: '#FFFFFF',
                    },
                    fontFamily: {
                        sans: ['Bahnschrift', 'Neue Haas Grotesk', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    transitionDuration: {
                        '1500': '1500ms',
                        '2000': '2000ms',
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="font-sans font-light tracking-wide text-offblack bg-purewhite min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="fixed top-0 left-0 w-full bg-purewhite/95 backdrop-blur-md z-50 py-5 px-6 md:px-12 flex justify-between items-center transition-all duration-300" id="navbar">
        <div class="text-base md:text-xl tracking-widest lowercase font-medium">
            <a href="index.html" class="hover:opacity-60 transition-opacity">eclipse still burns</a>
        </div>

        <nav class="hidden md:flex space-x-12 text-xs uppercase tracking-[0.2em]">
            <a href="work.html" class="hover:text-gray-400 transition-colors duration-300">Work</a>
            <a href="prints.html" aria-current="page" class="border-b border-offblack pb-1">Prints</a>
            <a href="index.html#about" class="hover:text-gray-400 transition-colors duration-300">About</a>
        </nav>

        <div class="flex space-x-4 md:space-x-6 items-center">
            <a href="https://instagram.com/eclipsestillburns/" target="_blank" aria-label="Instagram" class="hover:opacity-50 transition-opacity">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
            </a>
            <a href="mailto:rjmdl.slg@gmail.com" aria-label="Email" class="hover:opacity-50 transition-opacity">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
            </a>
            <!-- Menu button (phones only) -->
            <button id="menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="mobile-menu" class="md:hidden hover:opacity-50 transition-opacity">
                <svg id="icon-menu" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="8" x2="21" y2="8"></line>
                    <line x1="3" y1="16" x2="21" y2="16"></line>
                </svg>
                <svg id="icon-close" class="hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="5" x2="19" y2="19"></line>
                    <line x1="19" y1="5" x2="5" y2="19"></line>
                </svg>
            </button>
        </div>

        <!-- Mobile menu (phones only) -->
        <nav id="mobile-menu" class="hidden md:hidden absolute top-full left-0 w-full bg-purewhite/95 backdrop-blur-md px-6 pt-2 pb-6 text-xs uppercase tracking-[0.2em]">
            <a href="work.html" class="block py-3 hover:text-gray-400 transition-colors duration-300">Work</a>
            <a href="prints.html" aria-current="page" class="block py-3">Prints</a>
            <a href="index.html#about" class="block py-3 hover:text-gray-400 transition-colors duration-300">About</a>
        </nav>
    </header>

    <main class="flex-grow pt-32 px-6 md:px-12 pb-32 flex items-center justify-center">
        <section id="prints" class="text-center reveal active">
            <h1 class="text-xl md:text-4xl leading-relaxed md:leading-loose font-normal uppercase tracking-[0.2em] mb-6">Prints</h1>
            <p class="text-sm md:text-base text-black font-normal tracking-widest uppercase">Coming soon</p>
        </section>
    </main>

    <footer class="px-6 md:px-12 py-12 border-t border-gray-100 bg-purewhite">
        <div class="max-w-7xl mx-auto text-center md:text-left text-xs text-gray-400 tracking-widest uppercase flex flex-col md:flex-row justify-between items-center">
            <p>&copy; 2026 Raju Mandal. All rights reserved.</p>
            <p class="mt-4 md:mt-0 lowercase">eclipse still burns</p>
        </div>
    </footer>

    <!-- Phone menu toggle -->
    <script>
        (function () {
            var btn = document.getElementById('menu-btn'), menu = document.getElementById('mobile-menu');
            if (!btn || !menu) return;
            function set(open) {
                menu.classList.toggle('hidden', !open);
                btn.setAttribute('aria-expanded', open);
                document.getElementById('icon-menu').classList.toggle('hidden', open);
                document.getElementById('icon-close').classList.toggle('hidden', !open);
            }
            btn.addEventListener('click', function () { set(menu.classList.contains('hidden')); });
            menu.addEventListener('click', function (e) { if (e.target.closest('a')) set(false); });
        })();
    </script>

</body>
</html>
