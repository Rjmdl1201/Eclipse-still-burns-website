</head>

        </div>

        <nav class="hidden md:flex space-x-12 text-xs uppercase tracking-[0.2em]">
            <a href="work.html" aria-current="page" class="border-b border-offblack pb-1">Work</a>
            <a href="prints.html" class="hover:text-gray-400 transition-colors duration-300">Prints</a>
            <a href="index.html#about" class="hover:text-gray-400 transition-colors duration-300">About</a>

        <div class="flex space-x-4 md:space-x-6 items-center">
            <a href="https://instagram.com/eclipsestillburns/" target="_blank" aria-label="Instagram" class="hover:opacity-50 transition-opacity">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

                </svg>
            </a>
            <a href="mailto:rjmdl.slg@gmail.com" aria-label="Email" class="hover:opacity-50 transition-opacity">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>

        <!-- Mobile menu (phones only) -->

    <main class="flex-grow pt-32 px-6 md:px-12 pb-32">

        <!-- Album list -->
        <section id="albums" hidden>
            <h1 class="text-xl md:text-4xl leading-relaxed md:leading-loose font-normal mt-12 mb-16 text-center">Album</h1>
            <div id="album-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-20"></div>
            <p id="empty" hidden class="text-sm text-black font-normal tracking-normal text-center">New albums coming soon.</p>
        </section>

        <!-- One album (opens as work.html?album=your-slug) -->
        <section id="album" hidden>
            <a href="work.html" class="text-xs uppercase tracking-widest hover:text-gray-400 transition-colors duration-300">[ All albums ]</a>
            <h1 id="album-title" class="text-xl md:text-4xl leading-relaxed md:leading-loose font-normal mt-12 mb-16 text-center"></h1>
            <div id="album-photos" class="grid grid-cols-1 md:grid-cols-12 gap-y-32 md:gap-x-8"></div>
        </section>

    </main>

    <footer class="px-6 md:px-12 py-12 border-t border-gray-100 bg-purewhite">
        <div class="max-w-7xl mx-auto text-center md:text-left text-xs text-gray-400 tracking-widest uppercase flex flex-col md:flex-row justify-between items-center">
            <p>&copy; 2026 Raju Mandal. All rights reserved.</p>
            <p class="mt-4 md:mt-0 lowercase">eclipse still burns</p>
        </div>
    </footer>

    <script>
        // ---------------------------------------------------------------
        // ADD NEW ALBUMS HERE. The album list and album pages build themselves.
        // Put the photos in:  images/work/<slug>/   e.g. images/work/seas/1.jpg
        // Copy the block below (remove the // marks) once per album.
        // ---------------------------------------------------------------
        var ALBUMS = [
            // {
            //     slug: 'seas',                          // link becomes work.html?album=seas
            //     title: 'Seas',
            //     cover: 'images/work/seas/1.jpg',       // thumbnail on the album list
            //     photos: [
            //         ['images/work/seas/1.jpg', 'Caption'],   // leave the caption '' for none
            //         ['images/work/seas/2.jpg', ''],
            //     ]
            // },
        ];

        (function () {
            var $ = function (id) { return document.getElementById(id); };
            var pad = function (n) { return (n < 10 ? '0' : '') + n; };
            var esc = function (s) {
                return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
                });
            };

            // Same staggered rhythm as the homepage (phones: one column)
            var LAYOUT = [
                'md:col-span-8 md:col-start-3',
                'md:col-span-5 md:col-start-1',
                'md:col-span-5 md:col-start-8',
                'md:col-span-10 md:col-start-2'
            ];
            var CAP = 'mt-6 text-sm uppercase tracking-widest text-black font-normal flex flex-col md:flex-row justify-between';
            var NOTE = 'text-black font-normal normal-case mt-2 md:mt-0 tracking-normal text-base';

            var slug = new URLSearchParams(location.search).get('album');
            var album = ALBUMS.filter(function (a) { return a.slug === slug; })[0];

            if (album) {
                document.title = album.title + ' | Album | eclipse still burns';
                $('album-title').textContent = album.title;
                $('album-photos').innerHTML = album.photos.map(function (p, i) {
                    return '<figure class="gallery-item reveal col-span-1 ' + LAYOUT[i % 4] + '">' +
                        '<div class="gallery-img-container"><img src="' + esc(p[0]) + '" alt="' + esc(album.title) + ' ' + (i + 1) + '" loading="lazy" class="w-full h-auto object-contain"></div>' +
                        '<figcaption class="' + CAP + '"><span>[ Image ' + pad(i + 1) + ' ]</span>' +
                        (p[1] ? '<span class="' + NOTE + '">' + esc(p[1]) + '</span>' : '') +
                        '</figcaption></figure>';
                }).join('');
                $('album').hidden = false;
            } else {
                $('album-grid').innerHTML = ALBUMS.map(function (a, i) {
                    var cover = a.cover || (a.photos[0] && a.photos[0][0]) || '';
                    return '<a href="work.html?album=' + encodeURIComponent(a.slug) + '" class="gallery-item reveal block">' +
                        '<div class="gallery-img-container"><img src="' + esc(cover) + '" alt="' + esc(a.title) + '" loading="lazy" class="w-full h-auto object-cover aspect-[4/5]"></div>' +
                        '<div class="' + CAP + '"><span>[ Album ' + pad(i + 1) + ' ]</span><span class="' + NOTE + '">' + esc(a.title) + '</span></div></a>';
                }).join('');
                $('empty').hidden = ALBUMS.length > 0;
                $('albums').hidden = false;
            }

            // Fade-in on scroll (same "reveal" / "active" classes as the homepage)
            var items = document.querySelectorAll('.reveal');
            if ('IntersectionObserver' in window) {
                var io = new IntersectionObserver(function (entries) {
                    entries.forEach(function (e) {
                        if (e.isIntersecting) { e.target.classList.add('active'); io.unobserve(e.target); }
                    });
                }, { threshold: 0.1 });
                items.forEach(function (el) { io.observe(el); });
            } else {
                items.forEach(function (el) { el.classList.add('active'); });
            }

            // Phone menu
            var btn = $('menu-btn'), menu = $('mobile-menu');
            function setMenu(open) {
                menu.classList.toggle('hidden', !open);
                btn.setAttribute('aria-expanded', open);
                $('icon-menu').classList.toggle('hidden', open);
                $('icon-close').classList.toggle('hidden', !open);
            }
            btn.addEventListener('click', function () { setMenu(menu.classList.contains('hidden')); });
            menu.addEventListener('click', function (e) { if (e.target.closest('a')) setMenu(false); });
        })();
    </script>

</body>
</html>
